<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrawDo - Visual Tasks</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f4f5;
            color: #18181b;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 0.5rem; }
        p { color: #71717a; margin-bottom: 2rem; }
        
        #grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 800px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        canvas {
            border: 2px dashed #e4e4e7;
            border-radius: 8px;
            cursor: crosshair;
            background: #fff;
        }

        .controls {
            display: flex;
            justify-content: space-between;
        }

        button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }
        
        .btn-clear { background: #fee2e2; color: #ef4444; }
        .btn-done { background: #dcfce7; color: #22c55e; }
        
        #add-btn {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: #18181b;
            color: white;
            font-size: 1.1rem;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>DrawDo</h1>
    <p>Draw your tasks. Keep it simple.</p>

    <div id="grid">
        <!-- Cards will be injected here by JS -->
    </div>

    <button id="add-btn">+ Add Task</button>

    <script>
        const grid = document.getElementById('grid');
        const addBtn = document.getElementById('add-btn');

        // Load tasks from localStorage or initialize with one empty task
        let tasks = JSON.parse(localStorage.getItem('drawdo_tasks')) || [{ id: Date.now().toString(), dataUrl: null, done: false }];

        function saveTasks() {
            localStorage.setItem('drawdo_tasks', JSON.stringify(tasks));
        }

        function setupCanvasDrawing(canvas, task) {
            const ctx = canvas.getContext('2d');
            let isDrawing = false;
            let lastX = 0;
            let lastY = 0;

            // Load existing image if any
            if (task.dataUrl) {
                const img = new Image();
                img.onload = () => ctx.drawImage(img, 0, 0);
                img.src = task.dataUrl;
            } else {
                // Fill with white background
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            function getCoordinates(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            }

            function startDrawing(e) {
                if (task.done) return;
                isDrawing = true;
                const { x, y } = getCoordinates(e);
                lastX = x;
                lastY = y;
                e.preventDefault();
            }

            function draw(e) {
                if (!isDrawing || task.done) return;
                const { x, y } = getCoordinates(e);
                
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(x, y);
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.stroke();
                
                lastX = x;
                lastY = y;
                e.preventDefault();
            }

            function stopDrawing() {
                if (isDrawing) {
                    isDrawing = false;
                    task.dataUrl = canvas.toDataURL();
                    saveTasks();
                }
            }

            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);
            
            canvas.addEventListener('touchstart', startDrawing, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', stopDrawing);
        }

        function renderTaskCard(task) {
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `task-${task.id}`;
            
            card.innerHTML = `
                <canvas width="180" height="180" style="${task.done ? 'opacity: 0.5; pointer-events: none;' : ''}"></canvas>
                <div class="controls">
                    <button class="btn-clear">Clear</button>
                    <button class="btn-done">${task.done ? 'Undo' : 'Done'}</button>
                </div>
            `;
            
            const canvas = card.querySelector('canvas');
            const clearBtn = card.querySelector('.btn-clear');
            const doneBtn = card.querySelector('.btn-done');
            
            setupCanvasDrawing(canvas, task);
            
            clearBtn.addEventListener('click', () => {
                if (task.done) return;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                task.dataUrl = canvas.toDataURL();
                saveTasks();
            });

            doneBtn.addEventListener('click', () => {
                task.done = !task.done;
                canvas.style.opacity = task.done ? '0.5' : '1';
                canvas.style.pointerEvents = task.done ? 'none' : 'auto';
                doneBtn.textContent = task.done ? 'Undo' : 'Done';
                saveTasks();
            });

            return card;
        }

        function renderAll() {
            grid.innerHTML = '';
            tasks.forEach(task => {
                grid.appendChild(renderTaskCard(task));
            });
        }

        addBtn.addEventListener('click', () => {
            tasks.push({ id: Date.now().toString(), dataUrl: null, done: false });
            saveTasks();
            renderAll();
        });
        
        renderAll();
    </script>
</body>
</html>
